[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-sdk"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["opentelemetry-sdk>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2"]

[tool.setuptools.packages.find]
include = ["opspilot_sdk*"]
